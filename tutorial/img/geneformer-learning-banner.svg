</g>
<g fill="none" stroke="url(#arc)" stroke-width="1.5"><path d="M700 132 C790 80 836 108 878 145"/><path d="M693 190 C790 148 824 175 864 200"/><path d="M700 246 C780 229 824 239 859 260"/><path d="M700 302 C780 305 824 314 878 328"/></g>
<g fill="#9bdec8" opacity=".8"><circle cx="710" cy="126" r="4"/><circle cx="760" cy="106" r="2"/><circle cx="802" cy="106" r="3"/><circle cx="711" cy="185" r="3"/><circle cx="762" cy="171" r="4"/><circle cx="805" cy="171" r="2"/><circle cx="716" cy="242" r="3"/><circle cx="772" cy="237" r="3"/><circle cx="710" cy="304" r="4"/><circle cx="774" cy="310" r="2"/></g>
<g font-family="Arial, sans-serif"><text x="72" y="100" font-size="15" font-weight="bold" letter-spacing="4" fill="#a8e4d1">A HANDS-ON LEARNING JOURNEY</text><text x="68" y="184" font-family="Georgia, serif" font-size="72" fill="#f1f8ef">Geneformer</text><text x="72" y="235" font-size="23" fill="#c7ddd6">Explore the language of cells</text><path d="M72 263 H380" stroke="#b4deca" stroke-width="1" opacity=".5"/><text x="72" y="300" font-size="15" letter-spacing="2" fill="#f0cc92">RANK  /  LEARN  /  PERTURB  /  INTERPRET</text></g>
