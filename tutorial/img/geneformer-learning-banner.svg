<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
<title id="title">Geneformer learning: from cell to insight</title>
<desc id="desc">An artistic cell, ranked gene-like marks and constellations of points suggesting the journey from single-cell data to model representations.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071f2c"/><stop offset=".6" stop-color="#123b43"/><stop offset="1" stop-color="#1b4d49"/></linearGradient>
 <radialGradient id="cell"><stop stop-color="#54b8a2" stop-opacity=".5"/><stop offset=".7" stop-color="#1a7d75" stop-opacity=".22"/><stop offset="1" stop-color="#9fe2c4" stop-opacity=".06"/></radialGradient>
 <linearGradient id="arc"><stop stop-color="#d7bd83" stop-opacity=".05"/><stop offset=".5" stop-color="#edd29a" stop-opacity=".9"/><stop offset="1" stop-color="#7ad3b6" stop-opacity=".15"/></linearGradient>
 <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a7ddd2" opacity=".14"/></pattern>
</defs>
<rect width="1440" height="460" fill="url(#bg)"/><rect width="1440" height="460" fill="url(#dots)"/>
<g fill="none" opacity=".4" stroke="#8dc6ba"><path d="M0 365 C260 275 380 440 620 350 S1010 280 1440 330"/><path d="M0 384 C260 294 380 459 620 369 S1010 299 1440 349"/><path d="M0 403 C260 313 380 478 620 388 S1010 318 1440 368"/></g>
