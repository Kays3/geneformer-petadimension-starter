 <ellipse rx="125" ry="61" fill="none" stroke="url(#arc)" stroke-width="1.4" transform="rotate(-25)"/>
 <ellipse rx="125" ry="61" fill="none" stroke="#77cdb5" stroke-opacity=".32" transform="rotate(38)"/>
 <circle cx="-10" cy="0" r="58" fill="#bce2bd" fill-opacity=".14" stroke="#c5e8ce" stroke-opacity=".55"/>
 <circle cx="-10" cy="0" r="43" fill="none" stroke="#dbeecb" stroke-opacity=".28"/>
 <g fill="#c2ead8" opacity=".85"><circle cx="-98" cy="-42" r="4"/><circle cx="-83" cy="61" r="3"/><circle cx="-48" cy="-108" r="3"/><circle cx="56" cy="-99" r="4"/><circle cx="110" cy="-38" r="3"/><circle cx="88" cy="63" r="4"/><circle cx="17" cy="115" r="3"/><circle cx="-39" cy="91" r="3"/></g>
