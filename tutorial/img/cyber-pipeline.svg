<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 350" role="img" aria-labelledby="title desc">
<title id="title">Geneformer quickstart pipeline</title><desc id="desc">PBMC data is prepared and tokenized, embedded with a frozen Geneformer model, and checked and plotted as a UMAP and CSV.</desc>
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#68e3e0" stroke-opacity=".08"/></pattern></defs><rect width="1400" height="350" fill="#0b1220"/><rect width="1400" height="350" fill="url(#g)"/>
<text x="42" y="52" fill="#76e9df" font-family="monospace" letter-spacing="4" font-size="16">DATA FLOW  //  QUICKSTART</text><path d="M58 205H1340" stroke="#f55360" stroke-width="3"/>
<g font-family="Arial,sans-serif"><g transform="translate(42 88)"><rect width="245" height="152" fill="#142738" stroke="#57cbd0"/><text x="18" y="29" font-family="monospace" fill="#ee6975" font-size="13">01 / INPUT</text><text x="18" y="69" fill="#f2f7f6" font-size="23" font-weight="bold">PBMC 3k</text><text x="18" y="102" fill="#b4cdce" font-size="16">2,638 cells</text><text x="18" y="127" fill="#b4cdce" font-size="15">prepare Ensembl IDs</text></g>
<g transform="translate(310 88)"><rect width="245" height="152" fill="#142738" stroke="#57cbd0"/><text x="18" y="29" font-family="monospace" fill="#ee6975" font-size="13">02 / ENCODE</text><text x="18" y="69" fill="#f2f7f6" font-size="23" font-weight="bold">Tokenize</text><text x="18" y="102" fill="#b4cdce" font-size="16">rank detected genes</text><text x="18" y="127" fill="#b4cdce" font-size="15">per cell</text></g>
<g transform="translate(578 88)"><rect width="245" height="152" fill="#142738" stroke="#57cbd0"/><text x="18" y="29" font-family="monospace" fill="#ee6975" font-size="13">03 / REPRESENT</text><text x="18" y="69" fill="#f2f7f6" font-size="23" font-weight="bold">Geneformer</text><text x="18" y="102" fill="#b4cdce" font-size="16">V2-104M, frozen</text><text x="18" y="127" fill="#b4cdce" font-size="15">768-value embedding</text></g>
<g transform="translate(846 88)"><rect width="245" height="152" fill="#142738" stroke="#57cbd0"/><text x="18" y="29" font-family="monospace" fill="#ee6975" font-size="13">04 / VERIFY</text><text x="18" y="69" fill="#f2f7f6" font-size="23" font-weight="bold">Check</text><text x="18" y="102" fill="#b4cdce" font-size="16">NaN, zero rows</text><text x="18" y="127" fill="#b4cdce" font-size="15">and vector spread</text></g>
<g transform="translate(1114 88)"><rect width="245" height="152" fill="#142738" stroke="#57cbd0"/><text x="18" y="29" font-family="monospace" fill="#ee6975" font-size="13">05 / EXPLORE</text><text x="18" y="69" fill="#f2f7f6" font-size="23" font-weight="bold">View</text><text x="18" y="102" fill="#b4cdce" font-size="16">UMAP picture</text><text x="18" y="127" fill="#b4cdce" font-size="15">and embeddings CSV</text></g></g>
<text x="43" y="294" fill="#829fa8" font-family="monospace" font-size="14" letter-spacing="2">ILLUSTRATIVE PIPELINE  //  NOT A BIOLOGICAL NETWORK</text><path d="M42 320H1358" stroke="#2d6a70"/>
</svg>
